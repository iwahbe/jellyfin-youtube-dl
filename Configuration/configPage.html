<!DOCTYPE html>
<html>
<head>
    <title>YouTube DL</title>
</head>
<body>
    <div id="YouTubeDLConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="YouTubeDLConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel" for="YtDlpPath">yt-dlp Path</label>
                        <input is="emby-input" type="text" id="YtDlpPath" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel" for="DownloadDirectory">Download Directory</label>
                        <input is="emby-input" type="text" id="DownloadDirectory" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel" for="DefaultGenre">Default Genre</label>
                        <input is="emby-input" type="text" id="DefaultGenre" />
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        var pluginId = 'a7b8c9d0-e1f2-3456-7890-abcdef012345';
        document.querySelector('#YouTubeDLConfigPage').addEventListener('pageshow', function() {
            ApiClient.getPluginConfiguration(pluginId).then(function(config) {
                document.querySelector('#YtDlpPath').value = config.YtDlpPath || '';
                document.querySelector('#DownloadDirectory').value = config.DownloadDirectory || '';
                document.querySelector('#DefaultGenre').value = config.DefaultGenre || '';
            });
        });
        document.querySelector('#YouTubeDLConfigForm').addEventListener('submit', function(e) {
            e.preventDefault();
            ApiClient.getPluginConfiguration(pluginId).then(function(config) {
                config.YtDlpPath = document.querySelector('#YtDlpPath').value;
                config.DownloadDirectory = document.querySelector('#DownloadDirectory').value;
                config.DefaultGenre = document.querySelector('#DefaultGenre').value;
                ApiClient.updatePluginConfiguration(pluginId, config).then(function() {
                    Dashboard.processPluginConfigurationUpdateResult();
                });
            });
            return false;
        });
    </script>
</body>
</html>
